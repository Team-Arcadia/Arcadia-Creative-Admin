plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

version = mod_version
group = mod_group_id

base {
    // Human-readable jar name; the mod id itself cannot contain hyphens.
    archivesName = mod_slug
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// GameTests live in their own source set so they never ship in the release jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    addModdingDependenciesTo sourceSets.gametest

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // A second player for what needs two (two admins editing at once): its own name, so the
        // server does not drop the first client, and its own folder for options and logs.
        client2 {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll '--username', 'Dev2'
        }
        // The enforcement path only exists on a logical server, so a dedicated server run is the
        // only environment that exercises it the way a production install does.
        server {
            server()
            // -PserverGui keeps the server window, whose command field is the only console a Gradle
            // run offers: the task does not forward standard input.
            if (!project.hasProperty('serverGui')) {
                programArgument '--nogui'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Runs every GameTest of the mod headless and exits non-zero on a failure.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            // The tests rewrite the policy file; keep them away from the config the dev runs use.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Installs the stand-in permission handler of the gametest source set (TestPermissions).
            systemProperty 'creativeadmin.testPermissions', 'true'
        }
        // A real client driven by AdminScreenSmokeTest: a singleplayer world where the host is an
        // admin, the admin screen used through its buttons, then smoke-report.txt and quit. Needs a
        // desktop session, it opens a window.
        adminSmoke {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/adminsmoke')
            systemProperty 'creativeadmin.adminSmoke', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Test-only, pinned exactly, the same versions Better Creative uses. ModDevGradle puts no
    // Minecraft on the unit test classpath, so the shipped JSON files need their own parser.
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

// Unit tests cover what carries no Minecraft type: the shipped resources and the loader metadata.
// Anything needing a registry, a player or a server is a GameTest instead.
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Expose gradle.properties values to neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_slug               : mod_slug,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replacements
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Ship the licensing terms inside the jar. The license states that each release
// is governed by the version distributed with it, so it has to actually be in
// the file — a downloaded jar must be able to state its own terms offline.
// CONTRIBUTORS.md ships too: §5.3(a) promises credit in the file "distributed
// with it", which only holds if the file is actually there.
tasks.named('jar', Jar).configure {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('NOTICE.md')) { into 'META-INF' }
    from(file('CONTRIBUTORS.md')) { into 'META-INF' }
}

// What a server owner downloads: the licensing terms, both languages and the mixin config must be
// inside, and nothing from the GameTest source set.
tasks.register('verifyJar') {
    group = 'verification'
    description = 'Fails unless the release jar holds every required entry and no test class.'
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    // Test classes can live in the screens' own package (AdminScreenSmokeTest), so a path filter is
    // not enough: every class the GameTest source set compiles must be absent from the jar.
    def testClasses = sourceSets.gametest.output.classesDirs
    inputs.file(jarFile)
    dependsOn 'gametestClasses'
    doLast {
        Set<String> entries = new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
            zip.entries().collect { it.name } as Set<String>
        }
        Set<String> testEntries = [] as Set
        testClasses.each { dir ->
            if (dir.isDirectory()) {
                dir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
                    testEntries << dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                }
            }
        }
        List<String> required = ['META-INF/LICENSE', 'META-INF/NOTICE.md', 'META-INF/CONTRIBUTORS.md',
                                 'META-INF/neoforge.mods.toml', "${mod_slug}.mixins.json".toString(),
                                 "assets/${mod_id}/lang/en_us.json".toString(),
                                 "assets/${mod_id}/lang/fr_fr.json".toString()]
        List<String> missing = required.findAll { !entries.contains(it) }
        List<String> leaked = entries.findAll { it.contains('/gametest/') || it.endsWith('.nbt') || testEntries.contains(it) }.sort()
        if (!missing.isEmpty() || !leaked.isEmpty()) {
            throw new GradleException("${jarFile.get().asFile.name}: missing ${missing}, test files shipped ${leaked}")
        }
        logger.lifecycle("Jar content verified: ${entries.size()} entries")
    }
}
tasks.named('check') { dependsOn 'verifyJar' }

// The client run exits 0 even when the game failed to start, so the verdict comes from its report.
def adminSmokeDir = file('run/adminsmoke')

tasks.register('verifyAdminSmoke') {
    group = 'verification'
    description = 'Fails unless the admin screen smoke run reported every check as passed.'
    doLast {
        File log = new File(adminSmokeDir, 'logs/latest.log')
        if (log.isFile()) {
            List<String> found = ['InvalidInjectionException', 'Mixin apply failed', 'failed to load correctly']
                    .findAll { log.getText('UTF-8').contains(it) }
            if (!found.isEmpty()) {
                throw new GradleException("${log} contains ${found}")
            }
        }
        File report = new File(adminSmokeDir, 'smoke-report.txt')
        if (!report.isFile()) {
            throw new GradleException("No ${report}: the client never finished the smoke run")
        }
        List<String> lines = report.readLines('UTF-8')
        lines.each { logger.lifecycle(it) }
        if (lines.isEmpty() || !lines.last().startsWith('RESULT PASS')) {
            throw new GradleException("Admin screen smoke run failed, see ${report}")
        }
    }
}

tasks.configureEach { Task task ->
    if (task.name == 'runAdminSmoke') {
        task.doFirst {
            // Fresh world, first-start policy, no report from a previous run.
            project.delete(new File(adminSmokeDir, 'saves'), new File(adminSmokeDir, 'config/creative-admin'),
                    new File(adminSmokeDir, 'smoke-report.txt'), new File(adminSmokeDir, 'logs/latest.log'),
                    new File(adminSmokeDir, 'screenshots'))
            adminSmokeDir.mkdirs()
            // No accessibility onboarding, no pause on focus loss, no sound.
            new File(adminSmokeDir, 'options.txt').setText([
                    'onboardAccessibility:false', 'pauseOnLostFocus:false', 'tutorialStep:none',
                    'joinedFirstServer:true', 'skipMultiplayerWarning:true', 'soundCategory_master:0.0',
                    'lang:en_us'].join('\n'), 'UTF-8')
        }
        task.finalizedBy 'verifyAdminSmoke'
        task.mustRunAfter 'runGameTestServer'
    } else if (task.name == 'runGameTestServer') {
        task.mustRunAfter 'build'
    }
}

// Everything automated, in order: unit tests, GameTests on a server, the admin screen on a client.
tasks.register('testAll') {
    group = 'verification'
    description = 'Unit tests, GameTests and the admin screen smoke run.'
    dependsOn 'build', 'runGameTestServer', 'runAdminSmoke'
}

/** Everything above the first `---` separator line, which is the newest version's section. */
static String currentReleaseNotes(String text) {
    List<String> section = []
    for (String line : text.readLines()) {
        if (line.trim() == '---') {
            break
        }
        section.add(line)
    }
    String notes = section.join('\n').trim()
    if (notes.isEmpty()) {
        throw new GradleException('publishing/release-notes.md has no section before its first --- separator')
    }
    return notes
}

// ---------------------------------------------------------------------------
// Publishing to CurseForge and Modrinth.
//
// Tokens are read from the environment and never stored in the repository.
// Project ids live in gradle.properties because they are public identifiers.
//
//   ./gradlew publishMods -PdryRun          validate everything, upload nothing
//   ./gradlew publishMods                   real upload, needs both tokens
// ---------------------------------------------------------------------------
publishMods {
    file = tasks.jar.archiveFile
    displayName = "${mod_name} ${mod_version} for NeoForge ${minecraft_version}"
    version = mod_version
    // Only the leading section: an upload carries its own notes, not the whole history.
    changelog = providers.fileContents(
            layout.projectDirectory.file('publishing/release-notes.md')).asText
            .map { text -> currentReleaseNotes(text) }
    type = STABLE
    modLoaders.add('neoforge')

    // Nothing is uploaded when -PdryRun is passed; the plugin still validates the payload.
    dryRun = project.hasProperty('dryRun')

    curseforge {
        projectId = providers.gradleProperty('curseforge_project_id')
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        // Enforcement runs on the server; the client side is optional (admin screen, hidden tabs).
        clientRequired = false
        serverRequired = true
    }

    modrinth {
        projectId = providers.gradleProperty('modrinth_project_id')
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
    }
}

// A clear stop instead of a plugin error when the store projects are not linked yet.
tasks.matching { it.name in ['publishCurseforge', 'publishModrinth'] }.configureEach { task ->
    task.doFirst {
        String key = task.name == 'publishCurseforge' ? 'curseforge_project_id' : 'modrinth_project_id'
        if (!project.hasProperty(key) || project.property(key).toString().isBlank()) {
            throw new GradleException("${key} is not set in gradle.properties; see publishing/PUBLISHING.md step 2")
        }
    }
}
