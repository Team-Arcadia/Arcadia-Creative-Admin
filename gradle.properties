org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.241
neo_version_range=[21.1.241,)
loader_version_range=[4,)

# Mod
# mod_id must match ^[a-z][a-z0-9_]{1,63}$ (FML ModInfo) — hyphens are rejected at load time.
# mod_slug is the human-readable form, used only for file names.
mod_id=arcadiacreativeadmin
mod_slug=arcadia-creative-admin
mod_name=Arcadia Creative Admin
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=net.thefricadelle.arcadiacreativeadmin
mod_authors=THEFricadelle
mod_description=Server-enforced creative restrictions: a strict per-profile whitelist of the items and creative tabs players may take while in creative mode.

# Publishing — public project identifiers, filled in after creating each project.
# Tokens are NOT stored here: they are read from CURSEFORGE_TOKEN and MODRINTH_TOKEN.
curseforge_project_id=
modrinth_project_id=
