modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"

[[mixins]]
config = "${mod_slug}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The mod before its rename. Both ids would otherwise load side by side and apply everything twice.
[[dependencies.${mod_id}]]
modId = "arcadiacreativeadmin"
type = "incompatible"
reason = "Arcadia Creative Admin is the former name of this mod. Remove its jar and keep this one."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
